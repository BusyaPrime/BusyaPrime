name: Metrics
on:
  schedule: [{ cron: "0 */6 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"] }
permissions:
  contents: write
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: BusyaPrime
          template: classic
          base: ""
          config_timezone: Asia/Tashkent
          repositories_skipped: BusyaPrime/BusyaPrime

          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, dockerfile, makefile, jupyter-notebook, blade, php
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: no
          plugin_languages_analysis_timeout: 30
          plugin_languages_categories: programming, markup

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 0

          plugin_followup: yes
          plugin_followup_sections: repositories

          plugin_lines: yes
          plugin_lines_history_limit: 1

          config_order: isocalendar, languages, topics, followup, lines
